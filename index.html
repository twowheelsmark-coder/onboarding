<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Getting Started | Two Wheels Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2A44;--body:#3A4256;--muted:#6B7385;--paper:#FFFFFF;--ground:#F3F5F8;--rule:#D9DEE6;
  --chalk:#3D6FB6;--found:#2F7D5B;--found-bg:#E7F3ED;--missing:#9A6413;--missing-bg:#FBF1E1;
  --ours:#4F5B72;--ours-bg:#E9ECF2;--error:#B3261E;
  --serif:"Source Serif 4",Georgia,serif;--sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--body);font:16px/1.6 var(--sans)}
a{color:var(--chalk)}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px;border-radius:3px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
code{font:500 14px/1.4 var(--mono);background:var(--ours-bg);color:var(--ink);padding:1px 6px;border-radius:4px;white-space:nowrap}

header.top{background:var(--ink);color:#fff;padding:48px 0 40px}
header.top .brands{display:flex;align-items:center;gap:18px;margin:0 0 32px;min-height:40px;flex-wrap:wrap}
header.top .twm-logo{height:40px;width:auto;display:block}
header.top .brand-sep{width:1px;height:30px;background:rgba(255,255,255,.28)}
header.top .client-logo{max-height:24px;max-width:220px;width:auto;height:auto;display:block}
header.top .client-logo.chip{background:#fff;padding:6px 10px;border-radius:6px;max-height:36px;box-sizing:content-box}
header.top h1{font:600 clamp(30px,6vw,44px)/1.12 var(--serif);margin:0 0 14px;letter-spacing:-.01em}
header.top p.lede{font-size:18px;line-height:1.55;color:#DCE2EC;margin:0;max-width:60ch}

.ticket{background:transparent;border:1px solid var(--rule);border-radius:6px;margin:40px 0 0;font-size:15px}
.ticket summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600;color:var(--ink)}
.ticket summary::-webkit-details-marker{display:none}
.ticket summary .chev{color:var(--muted);font-size:18px;transition:transform .2s ease}
.ticket[open] summary .chev{transform:rotate(90deg)}
.ticket .inner{padding:0 18px 8px}
.ticket .sub{font-size:14px;color:var(--muted);margin:0 0 10px}
.ticket dl{margin:0}
.ticket .row{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:4px 16px;padding:11px 0;border-top:1px dashed var(--rule)}
.ticket dt{font-weight:600;color:var(--ink)}
.ticket dd{margin:0}

.progress{display:flex;align-items:center;gap:14px;margin:0 0 22px}
.progress .bar{flex:1;height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.progress .fill{height:100%;width:0;background:var(--found);transition:width .3s ease}
.progress .count{font-weight:600;color:var(--ink);font-size:15px;white-space:nowrap}

h2.section{font:600 26px/1.25 var(--serif);color:var(--ink);margin:40px 0 6px}
p.section-sub{margin:0 0 18px;color:var(--muted)}

.item{background:var(--paper);border:1px solid var(--rule);border-left:5px solid var(--rule);border-radius:6px;margin:0 0 14px}
.item.k-found{border-left-color:var(--found)}
.item.k-missing{border-left-color:var(--missing)}
.item.is-done{opacity:.72}
.item summary{list-style:none;cursor:pointer;padding:18px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:start}
.item summary::-webkit-details-marker{display:none}
.item .check{margin-top:3px}
.item .check input{width:20px;height:20px;accent-color:var(--found);cursor:pointer}
.item h3{font:600 19px/1.3 var(--serif);color:var(--ink);margin:0}
.item .ask{margin:4px 0 0;font-size:15px}
.item .chev{color:var(--muted);font-size:20px;line-height:1;transition:transform .2s ease;margin-top:2px}
.item[open] .chev{transform:rotate(90deg)}
.status{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;margin-top:8px}
.status.found{background:var(--found-bg);color:var(--found)}
.status.missing{background:var(--missing-bg);color:var(--missing)}
.status.optional{background:var(--ours-bg);color:var(--ours)}
.item .body{padding:0 20px 20px 54px}
.item h4{font:600 15px/1.4 var(--sans);color:var(--ink);margin:18px 0 6px}
.item ol,.item ul{margin:0;padding-left:22px}
.item li{margin:0 0 6px}
.item .clue{background:var(--ground);border-radius:6px;padding:12px 14px;margin:14px 0 0;font-size:15px}
.item .clue strong{color:var(--ink)}
.ui{font-weight:600;color:var(--ink)}

.answer{margin:16px 0 4px;padding:14px;border:1px solid var(--chalk);border-radius:6px;background:#F7F9FD}
.answer label{display:block;font-weight:600;color:var(--ink);margin:0 0 6px}
.answer input,.answer select{width:100%;font:16px/1.4 var(--sans);padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink)}
.answer input:focus,.answer select:focus{border-color:var(--chalk);outline:none;box-shadow:0 0 0 3px rgba(61,111,182,.2)}
.save-state{font-size:13px;color:var(--muted);min-height:18px;margin-top:6px}
.save-state.err{color:var(--error)}

.copy{font:600 13px/1 var(--sans);border:1px solid var(--rule);background:var(--paper);color:var(--chalk);border-radius:5px;padding:5px 9px;margin-left:6px;cursor:pointer;vertical-align:1px}
.copy:hover{border-color:var(--chalk)}
.copy.ok{color:var(--found);border-color:var(--found)}
.forward{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:16px;margin:12px 0 0}
.forward pre{white-space:pre-wrap;font:14px/1.55 var(--sans);margin:0 0 12px;color:var(--body)}
.btn{font:600 15px/1 var(--sans);background:var(--ink);color:#fff;border:0;border-radius:6px;padding:11px 16px;cursor:pointer}
.btn.ok{background:var(--found)}

.ours{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ours div{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.ours strong{display:block;color:var(--ink);margin-bottom:2px}
.ours span{font-size:15px}

.notice{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:28px 24px;margin:40px 0}
.notice h2{font:600 22px/1.3 var(--serif);color:var(--ink);margin:0 0 8px}
.loading{color:var(--muted);padding:40px 0}

footer{margin:48px 0 0;padding:28px 0 48px;border-top:1px solid var(--rule);font-size:15px;color:var(--muted)}

@media (max-width:560px){
  header.top .twm-logo{height:32px}
  header.top .client-logo{max-width:160px;max-height:20px}
  header.top .brands{gap:14px}
  .ticket .row{grid-template-columns:1fr}
  .item summary{padding:16px 14px;gap:4px 10px}
  .item .body{padding:0 14px 18px 14px}
  .ours{grid-template-columns:1fr}
}
/* About your business */
.q{background:var(--paper);border:1px solid var(--rule);border-left:5px solid var(--chalk);border-radius:6px;margin:0 0 14px}
.q.is-done{border-left-color:var(--found)}
.q summary{list-style:none;cursor:pointer;padding:16px 20px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:start}
.q summary::-webkit-details-marker{display:none}
.q h3{font:600 18px/1.3 var(--serif);color:var(--ink);margin:0}
.q .ask{margin:4px 0 0;font-size:15px}
.q .chev{color:var(--muted);font-size:20px;line-height:1;transition:transform .2s ease;margin-top:2px}
.q[open] .chev{transform:rotate(90deg)}
.status.review{background:#EAF0F9;color:var(--chalk)}
.status.done{background:var(--found-bg);color:var(--found)}
.q .body{padding:0 20px 20px}
.q .help{margin:0 0 12px;font-size:15px;color:var(--muted)}
.suggest{border:1px dashed var(--chalk);background:#F7F9FD;border-radius:6px;padding:14px 16px}
.suggest .label{font:600 13px/1.3 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--chalk);margin:0 0 8px}
.suggest .label + .note{margin-top:-6px}
.suggest .note{font-size:14px;color:var(--muted);margin:0 0 10px}
.qtext{white-space:normal;color:var(--body)}
.qtext ul{margin:0;padding-left:20px}
.qtext li{margin:0 0 4px}
.qtext p{margin:0 0 6px}
.mine{border:1px solid var(--found);background:var(--found-bg);border-radius:6px;padding:14px 16px}
.mine .label{font:600 13px/1.3 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--found);margin:0 0 8px}
.qactions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.q textarea,.q input.qin{width:100%;box-sizing:border-box;font:16px/1.5 var(--sans);padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink)}
.q textarea{min-height:150px;resize:vertical}
.q textarea:focus,.q input.qin:focus{border-color:var(--chalk);outline:none;box-shadow:0 0 0 3px rgba(61,111,182,.2)}
.q .save-state{margin-top:0}
.qintro{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;margin:0 0 18px;font-size:15px}
.dl-row{margin:6px 0 0}
@media (max-width:560px){ .q summary{padding:14px} .q .body{padding:0 14px 16px} .qactions .btn{flex:1 1 auto} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body{background:#fff}.copy,.btn,.progress,.answer{display:none}.item{break-inside:avoid}}
h2.section.first{margin-top:36px}
</style>
</head>

<script>
(function(){

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function rich(s){ return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
function copyBtn(text){ return '<button type="button" class="copy" data-copy="' + esc(text) + '">Copy</button>'; }
function ui(s){ return '<span class="ui">' + esc(s) + '</span>'; }
function link(url, label){ return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(label || url.replace(/^https?:\/\//, "")) + '</a>'; }
function ol(items){ return "<ol><li>" + items.join("</li><li>") + "</li></ol>"; }
function clue(title, text){ return '<div class="clue"><strong>' + esc(title) + '</strong> ' + text + '</div>'; }

/* ---------- Instruction library: generic, no client data ---------- */
var LIB = {

      (!v.page_found ? "<p>Ads on Facebook and Instagram run from a Meta business portfolio. Your site " + (v.instagram ? "links to Instagram (" + esc(v.instagram) + ") but " : "") + "doesn't link to a Facebook Page, so the steps below also tell us what exists.</p>" : "") +
      "<h4>Add us as a Partner</h4>" + ol([

        "In the left menu under " + ui("Users") + ", click " + ui("Partners") + ".",
        "Click " + ui("Add") + ", then " + ui("Give a partner access to your assets") + ".",
        "Paste our business ID <code>" + esc(bid) + "</code>" + copyBtn(bid) + " and click " + ui("Next") + ". You'll see Two Wheels Marketing."
      ]) +
      "<h4>Share these, with full control</h4>" + ol([
        ui("Pages") + ": your Facebook Page" + (v.page ? " (" + esc(v.page) + ")" : "") + ".",

      ].concat(v.ecommerce ? [ui("Catalogs") + ": your product catalog."] : []).concat([
        "For each one, turn on " + ui("Full control") + " (or switch on every permission), then click " + ui("Assign assets") + " or " + ui("Save") + ".",
        "Pick an answer in the box above so we know it's done."
      ])) +
      clue("Don't see Partners or Business settings?", "You may not have a business portfolio yet, or you're signed in to a different Facebook profile. Choose \"We don't have a business portfolio\" above and we'll walk you through it on a short call." +
        (v.parent_brand ? " If " + esc(v.parent_brand) + " set up your Page or Instagram for you, the company may own them in its own portfolio. Choose \"Some items weren't listed\" and, if " + esc(v.parent_brand) + " has guidelines for partner advertising, please send them our way." : ""))
  };},

  gads: function(v){ return {

      (v.found ? "" : "<p>We didn't find Google Ads tracking on your site, which usually means there's no account yet. Accounts are sometimes created without much notice, though, for example by accepting a \"promote your business\" offer inside Google Business Profile.</p>") +

  };},

  site_static: function(v, c){
    var note = "Hi,\n\nTwo Wheels Marketing is now handling advertising and analytics for " + c.client + " (" + c.domain + "). They need Google Tag Manager added to the site, and either of these options works:\n\n" +
      "1. They'll send a short Google Tag Manager code snippet. Please add it to every page (one part in the <head>, one right after the opening <body> tag)" + (v.host_detail ? ", deploy it to the " + v.host_detail : "") + (v.cdn ? ", and clear the " + v.cdn + " cache" : "") + ".\n\n" +

    };

  site_wordpress: function(v, c){ var login = v.login_url || ("https://" + c.domain + "/wp-admin"); return {

      "<h4>Give us access</h4>" + ol([
        "Log in at " + link(login) + ".",
        "Go to " + ui("Users") + ", then " + ui("Add New User") + ".",

  calendly: function(){ return {

    body:

      "<h4>Find your plan</h4>" + ol([

        "Click your profile picture, then " + ui("Billing") + ". Your plan is listed at the top."

  /* Generic item for anything the library doesn't cover (Shopify, Wix, GoDaddy DNS, Acuity...).
     Text fields support `code`, **bold UI label**, [link text](https://url) and {{agency_email}}. */
  custom: function(v, c){
    function fmt(s){
      return esc(s)
        .replace(/\{\{agency_email\}\}/g, "<code>" + esc(c.agency_email) + "</code>" + copyBtn(c.agency_email))
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, '<span class="ui">$1</span>')
        .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    }
    var body = (v.intro ? "<p>" + fmt(v.intro) + "</p>" : "");
    (v.sections || []).forEach(function(sec){
      body += (sec.heading ? "<h4>" + esc(sec.heading) + "</h4>" : "") + ol((sec.steps || []).map(fmt));
    });
    if (v.fallback) body += clue(v.fallback.title || "", fmt(v.fallback.text || ""));
    return {
      title: v.title || "",
      ask: fmt(v.ask || ""),
      kind: v.kind || "missing",
      status: v.status || (v.kind === "found" ? "Found on your site" : v.kind === "optional" ? "Optional for now" : "Needs a quick check"),

      body: body
    };

  dns_cloudflare: function(v, c){ return {

      "<h4>Give us access</h4>" + ol([

        "Open " + ui("Manage Account") + ", then " + ui("Members") + ", then " + ui("Invite") + ".",
        "Enter <code>" + esc(c.agency_email) + "</code>" + copyBtn(c.agency_email) + ", choose the " + ui("Administrator") + " role, and send the invite."

/* ---------- API ---------- */
function api(payload){
  if (!payload) return fetch(SCRIPT_URL + "?t=" + encodeURIComponent(token)).then(function(r){ return r.json(); });
  payload.t = token; // never "c" or "sid": Apps Script reserves those names
  return fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); });
}

function notice(title, text){
  document.getElementById("lede").textContent = "";
  app.innerHTML = '<div class="notice"><h2>' + esc(title) + "</h2><p>" + text + "</p></div>";
}

/* ---------- Render ---------- */
function render(){
  var c = state.cfg;
  document.title = "Getting Started: " + c.client + " | Two Wheels Marketing";
  if (c.logo){
    var b = document.getElementById("brands");
    b.insertAdjacentHTML("beforeend", '<span class="brand-sep" aria-hidden="true"></span><img class="client-logo' + (c.logo_style === "chip" ? " chip" : "") + '" src="' + esc(c.logo) + '" alt="' + esc(c.client) + '">');
  }
  document.getElementById("h1").textContent = "Getting us connected" + (c.contact ? ", " + c.contact : "");
  document.getElementById("lede").textContent = "This list is built for " + c.domain + ", so it only covers what your business actually uses. Check each item off as you go. Progress saves automatically, so you can stop and come back from any device.";

  var html = '<h2 class="section first">What we need from you</h2><p class="section-sub">Open any item for step-by-step help: where to look, what to click, and what to do if you get stuck.</p>';
  html += '<div class="progress" aria-live="polite"><div class="bar"><div class="fill" id="fill"></div></div><span class="count" id="count"></span></div>';

  (c.items || []).forEach(function(it){
    var fn = LIB[String(it.key).split(":")[0]]; if (!fn) return; // custom items use keys like "custom:shopify"
    var d = fn(it.vars || {}, c);
    var kind = it.optional ? "optional" : d.kind;
    var status = it.optional ? "Optional for now" : d.status;
    var p = state.progress[it.key] || {};
    html += '<details class="item k-' + kind + (p.checked ? " is-done" : "") + '" data-key="' + esc(it.key) + '">' +
      "<summary>" +
        '<span class="check"><input type="checkbox"' + (p.checked ? " checked" : "") + ' aria-label="Mark ' + esc(d.title) + ' as done"></span>' +
        "<span><h3>" + esc(d.title) + '</h3><p class="ask">' + d.ask + '</p><span class="status ' + kind + '">' + esc(status) + "</span></span>" +
        '<span class="chev" aria-hidden="true">&#8250;</span>' +
      "</summary>" +
      '<div class="body">' + (d.answer ? answerField(it.key, d.answer, p.answer) : "") + d.body + "</div>" +
    "</details>";
  });

  if (c.questions && c.questions.length) html += renderQuestions(c);

  if (c.handled && c.handled.length){
    html += '<h2 class="section">What we\'ll handle</h2><p class="section-sub">Nothing to do here. Once access is in place, we set these up inside accounts you own.</p><div class="ours">';
    c.handled.forEach(function(h){ html += "<div><strong>" + esc(h[0]) + "</strong><span>" + esc(h[1]) + "</span></div>"; });
    html += "</div>";
  }
  if (c.found && c.found.length){
    html += '<details class="ticket"><summary><span>What we found on ' + esc(c.domain) + '</span><span class="chev" aria-hidden="true">&#8250;</span></summary><div class="inner"><p class="sub">From our scan on ' + esc(c.scanned) + ". For reference only, nothing to do here.</p><dl>";
    (c.found || []).forEach(function(r){ html += '<div class="row"><dt>' + esc(r[0]) + "</dt><dd>" + rich(r[1]) + "</dd></div>"; });
    html += "</dl></div></details>";
  }
  html += '<footer>Questions? Email <a href="mailto:' + esc(c.contact_email || CONTACT) + '">' + esc(c.contact_email || CONTACT) + "</a> and we'll walk through any of these with you.</footer>";
  app.innerHTML = html;
  wire();
  wireQuestions();
  updateProgress();
  updateQProgress();
}

/* ---------- About your business ---------- */
function qText(t){
  var lines = String(t || "").split(/\n/), out = "", list = [];
  function flush(){ if (list.length){ out += "<ul><li>" + list.join("</li><li>") + "</li></ul>"; list = []; } }
  lines.forEach(function(l){
    var m = l.match(/^\s*[-*\u2022]\s+(.*)$/);
    if (m) list.push(esc(m[1]));
    else { flush(); if (l.trim()) out += "<p>" + esc(l) + "</p>"; }
  });
  flush();
  return '<div class="qtext">' + out + "</div>";
}
function qStamp(p){
  if (!p || !p.updated) return "Saved";
  var d = new Date(p.updated); if (isNaN(d)) return "Saved";
  return "Saved " + d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " at " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}
function renderQuestions(c){
  var html = '<h2 class="section">About your business</h2><p class="section-sub">These help us write ads that sound like you and reach the right people.</p>' +
    '<div class="qintro">To save you time, we filled in what we could from your website and Google listings. Those are just our initial research, and you know your business far better than we do. If one looks right, click <span class="ui">Looks right</span>. If not, click <span class="ui">Edit</span> and change whatever you like.</div>' +
    '<div class="progress" aria-live="polite"><div class="bar"><div class="fill" id="qfill"></div></div><span class="count" id="qcount"></span></div>';
  c.questions.forEach(function(q){ html += '<details class="q" data-key="' + esc(q.key) + '"></details>'; });
  html += '<p class="dl-row"><button type="button" class="btn ghost" id="qdownload">Download my answers</button></p>';
  return html;
}
function qState(q){
  var p = state.progress[q.key] || {};
  return { p: p, answered: !!(p.answer && p.answer.trim()) };
}
function drawQ(el, q, mode){
  var st = qState(q), p = st.p, status, cls, inner = "";
  if (st.answered){ status = p.source === "confirmed" ? "Confirmed" : "Answered"; cls = "done"; }
  else if (q.suggestion){ status = "Ready for your review"; cls = "review"; }
  else { status = "Needs your answer"; cls = "missing"; }
  el.classList.toggle("is-done", st.answered);
  var field = q.type === "short"
    ? '<input class="qin" type="text" maxlength="300" autocomplete="off" placeholder="' + esc(q.placeholder || "") + '">'
    : '<textarea maxlength="4000" placeholder="' + esc(q.placeholder || "") + '"></textarea>';
  if (mode === "edit"){
    inner = field + '<div class="qactions"><button type="button" class="btn" data-q="save">Save</button>' +
      ((st.answered || q.suggestion) ? '<button type="button" class="btn ghost" data-q="cancel">Cancel</button>' : "") +
      '<span class="save-state" aria-live="polite"></span></div>';
  } else if (st.answered){
    inner = '<div class="mine"><p class="label">Your answer</p>' + qText(p.answer) + '</div>' +
      '<div class="qactions"><button type="button" class="btn ghost" data-q="edit">Change</button>' +
      '<button type="button" class="btn ghost" data-q="undo">' + (p.source === "confirmed" ? "Undo" : q.suggestion ? "Reset to our suggestion" : "Clear answer") + "</button>" +
      '<span class="save-state" aria-live="polite">' +
      esc(qStamp(p) + (p.source === "confirmed" ? ", you confirmed our suggestion" : "")) + "</span></div>";
  } else if (q.suggestion){
    inner = '<div class="suggest"><p class="label">Our starting point</p>' + (q.note ? '<p class="note">' + esc(q.note) + "</p>" : "") + qText(q.suggestion) + "</div>" +
      '<div class="qactions"><button type="button" class="btn" data-q="confirm">Looks right</button><button type="button" class="btn ghost" data-q="edit">Edit</button><span class="save-state" aria-live="polite"></span></div>';
  } else {
    inner = field + '<div class="qactions"><button type="button" class="btn" data-q="save">Save</button><span class="save-state" aria-live="polite"></span></div>';
  }
  var wasOpen = el.open;
  el.innerHTML = "<summary><span><h3>" + esc(q.title) + '</h3><p class="ask">' + esc(q.question) + '</p><span class="status ' + cls + '">' + esc(status) + "</span></span>" +
    '<span class="chev" aria-hidden="true">&#8250;</span></summary>' +
    '<div class="body">' + (q.help ? '<p class="help">' + esc(q.help) + "</p>" : "") + inner + "</div>";
  el.open = wasOpen;
  var input = el.querySelector("textarea, input.qin");
  if (input){
    input.value = st.answered ? p.answer : (q.suggestion && mode === "edit" ? q.suggestion : "");
    if (mode === "edit" && el.open) setTimeout(function(){ input.focus(); }, 0);
  }
  el.querySelectorAll("[data-q]").forEach(function(b){
    b.addEventListener("click", function(){ qAction(el, q, b.dataset.q); });
  });
  updateQProgress();
}
function qAction(el, q, act){
  if (act === "edit") return drawQ(el, q, "edit");
  if (act === "cancel") return drawQ(el, q, "view");
  var stateEl = el.querySelector(".save-state"), answer, source, checked = true;
  if (act === "undo"){
    var p0 = (state.progress[q.key] || {}), btn = el.querySelector('[data-q="undo"]');
    // Undoing a plain confirmation is safe; anything the client typed needs a second click so it isn't lost by accident
    if (p0.source !== "confirmed" && !btn.dataset.armed){
      btn.dataset.armed = "1"; btn.textContent = "Click again to clear what you wrote";
      setTimeout(function(){ if (btn.isConnected){ delete btn.dataset.armed; btn.textContent = q.suggestion ? "Reset to our suggestion" : "Clear answer"; } }, 5000);
      return;
    }
    answer = ""; source = ""; checked = false;
  }
  else if (act === "confirm"){ answer = q.suggestion; source = "confirmed"; }
  else {
    answer = (el.querySelector("textarea, input.qin").value || "").trim();
    if (!answer){ stateEl.textContent = "Type an answer first."; stateEl.classList.add("err"); return; }
    source = q.suggestion ? (answer === q.suggestion.trim() ? "confirmed" : "edited") : "written";
  }
  el.querySelectorAll("button").forEach(function(b){ b.disabled = true; });
  stateEl.classList.remove("err"); stateEl.textContent = "Saving";
  api({ key: q.key, answer: answer, source: source, checked: checked }).then(function(r){
    if (!r || !r.ok) throw new Error("save");
    state.progress = r.progress || state.progress;
    if (!state.progress[q.key]) state.progress[q.key] = {};
    state.progress[q.key].answer = answer; state.progress[q.key].source = source;
    if (!state.progress[q.key].updated) state.progress[q.key].updated = new Date().toISOString();
    drawQ(el, q, "view");
    if (act === "undo"){ var s2 = el.querySelector(".save-state"); if (s2) s2.textContent = q.suggestion ? "Cleared. Our suggestion is back for review." : "Cleared."; }
  }).catch(function(){
    el.querySelectorAll("button").forEach(function(b){ b.disabled = false; });
    stateEl.textContent = "Couldn't save. Check your connection and try again."; stateEl.classList.add("err");
  });
}
function wireQuestions(){
  var qs = (state.cfg.questions || []);
  qs.forEach(function(q){
    var el = app.querySelector('details.q[data-key="' + q.key.replace(/"/g, "") + '"]');
    if (el) drawQ(el, q, "view");
  });
  var dl = document.getElementById("qdownload");
  if (dl) dl.addEventListener("click", function(){
    var c = state.cfg, lines = [c.client + ": answers for Two Wheels Marketing", "Downloaded " + new Date().toLocaleString(), ""];
    qs.forEach(function(q){
      var p = state.progress[q.key] || {};
      lines.push(q.question); lines.push(p.answer && p.answer.trim() ? p.answer : "(not answered yet)"); lines.push("");
    });
    var blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = c.client.replace(/[^A-Za-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim() + " answers.txt";
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });
}
function updateQProgress(){
  var qs = (state.cfg && state.cfg.questions) || [], el = document.getElementById("qcount");
  if (!el) return;
  var done = qs.filter(function(q){ return qState(q).answered; }).length;
  el.textContent = done + " of " + qs.length + " answered";
  document.getElementById("qfill").style.width = (qs.length ? done / qs.length * 100 : 0) + "%";
}

function answerField(key, a, value){
  var id = "ans-" + key, field;
  if (a.type === "select"){
    field = '<select id="' + id + '">' + a.options.map(function(o){ return '<option value="' + esc(o) + '"' + (o === (value || "") ? " selected" : "") + ">" + esc(o || "Choose one") + "</option>"; }).join("") + "</select>";
  } else {
    field = '<input id="' + id + '" type="text" maxlength="200" autocomplete="off" placeholder="' + esc(a.placeholder || "") + '" value="' + esc(value || "") + '">';
  }
  return '<div class="answer" data-nocheck="' + esc(JSON.stringify(a.no_check || [])) + '" data-autocheck="' + (a.auto_check === false ? "0" : "1") + '"><label for="' + id + '">' + esc(a.label) + "</label>" + field + '<div class="save-state" aria-live="polite"></div></div>';
}

function updateProgress(){
  var items = app.querySelectorAll(".item"), done = 0;
  items.forEach(function(it){ if (it.querySelector(".check input").checked) done++; });
  document.getElementById("count").textContent = done + " of " + items.length + " done";
  document.getElementById("fill").style.width = (items.length ? done / items.length * 100 : 0) + "%";
}

function setCheck(item, cb, checked){
  var key = item.dataset.key;
  cb.checked = checked;
  item.classList.toggle("is-done", checked);
  updateProgress();
  return api({ key: key, checked: checked }).then(function(r){
    if (!r || !r.ok) throw new Error("save");
  }).catch(function(){
    cb.checked = !checked; item.classList.toggle("is-done", !checked); updateProgress();
    alertSave(item, "Couldn't save that checkmark. Check your connection and try again.");
  });
}

function alertSave(item, msg){
  var s = item.querySelector(".save-state");
  if (s){ s.textContent = msg; s.classList.add("err"); }
  else { item.querySelector(".ask").insertAdjacentHTML("afterend", '<p class="save-state err">' + esc(msg) + "</p>"); }
}

function wire(){
  app.querySelectorAll(".item").forEach(function(item){
    var cb = item.querySelector(".check input");
    cb.addEventListener("click", function(e){ e.stopPropagation(); });
    cb.addEventListener("change", function(){ setCheck(item, cb, cb.checked); });

    var field = item.querySelector(".answer input, .answer select");
    if (!field) return;
    var stateEl = item.querySelector(".save-state"), last = field.value, timer;
    function save(){
      var v = field.value.trim();
      if (v === last) return;
      stateEl.classList.remove("err"); stateEl.textContent = "Saving";
      api({ key: item.dataset.key, answer: v }).then(function(r){
        if (!r || !r.ok) throw new Error("save");
        last = v; stateEl.textContent = v ? "Saved" : "Cleared";
        var noCheck = []; try { noCheck = JSON.parse(item.querySelector(".answer").dataset.nocheck || "[]"); } catch (e) {}
        var auto = item.querySelector(".answer").dataset.autocheck !== "0";
        if (v && auto && !cb.checked && noCheck.indexOf(v) === -1) setCheck(item, cb, true);
      }).catch(function(){ stateEl.textContent = "Couldn't save your answer. Check your connection and try again."; stateEl.classList.add("err"); });
    }
    field.addEventListener("change", save);
    field.addEventListener("input", function(){ clearTimeout(timer); timer = setTimeout(save, 1200); });
  });

  app.querySelectorAll("[data-copy]").forEach(function(b){
    b.addEventListener("click", function(e){ e.preventDefault(); copyText(b.dataset.copy, b); });
  });
  app.querySelectorAll("[data-copy-target]").forEach(function(b){
    b.addEventListener("click", function(){ copyText(document.getElementById(b.dataset.copyTarget).textContent, b); });
  });
}

function copyText(text, btn){
  var label = btn.textContent;
  function ok(){ btn.textContent = "Copied"; btn.classList.add("ok"); setTimeout(function(){ btn.textContent = label; btn.classList.remove("ok"); }, 1800); }
  function fallback(){
    var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); ok(); } catch (e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
}

/* ---------- Boot ---------- */
if (!SCRIPT_URL){ notice("Checklist unavailable", "This page isn't set up yet. Email " + '<a href="mailto:' + CONTACT + '">' + CONTACT + "</a>."); return; }
if (!/^[a-z0-9]{8,32}$/.test(token)){
  notice("Use the link we sent you", "This page is personalized for each business. Open the link from our email, or contact " + '<a href="mailto:' + CONTACT + '">' + CONTACT + "</a>.");
  return;
}
api().then(function(r){
  if (!r || !r.ok){ notice("This link isn't active", "It may have expired or been mistyped. Email " + '<a href="mailto:' + CONTACT + '">' + CONTACT + "</a> and we'll send a fresh one."); return; }
  state.cfg = r.config; state.progress = r.progress || {};
  render();
}).catch(function(){
  notice("Couldn't load your checklist", "Check your connection and refresh the page. If it keeps happening, email " + '<a href="mailto:' + CONTACT + '">' + CONTACT + "</a>.");
});
})();
</script>
</body>
</html>
